function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));const s=document.querySelector('.save-note');if(s)s.title='Saved locally on this device'}catch(err){toast('Device storage unavailable. Export a backup to keep your changes.')}}
function goalDefaults(day){const wd=parseDate(day).getDay();let g=[['Movement','minutes',60],['Personal study','minutes',20],['Comedy writing','words',100],['Family attention','minutes',20]];if(wd===3||wd===5)g.push(['Outreach','contacts',5]);return g.map(([label,unit,target])=>({id:id(),label,unit,target,actual:''}))}
function ensureDay(day){if(!state.days[day]){const wd=parseDate(day).getDay();state.days[day]={intention:'',priorities:[],blocks:state.rhythms.filter(x=>x.days.includes(wd)).map(x=>({id:id(),ruleId:x.id,title:x.title,category:x.category,start:x.start,end:x.end,note:x.note,status:'planned',actual:''})),goals:goalDefaults(day),punchlines:'',prayers:'',reflection:'',madeAt:new Date().toISOString()};persist()}return state.days[day]}
function icon(k,n=17){let x={today:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>',week:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 14h3M14 14h3M8 18h3"/>',people:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',review:'<path d="M4 19V5M4 19h17M9 16v-5M14 16V7M19 16v-9"/>',rhythms:'<path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6 2.1-2.1"/><circle cx="12" cy="12" r="4"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2 2-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21h-3v-.8a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-2-2 .1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H5v-3h.8a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L7 8l2-2 .1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V4h3v.8a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3L18 6l2 2-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.8v3h-.8a1.7 1.7 0 0 0-1.8 1Z"/>',plus:'<path d="M12 5v14M5 12h14"/>',chevleft:'<path d="m15 18-6-6 6-6"/>',chevright:'<path d="m9 18 6-6-6-6"/>',edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"/>',check:'<path d="m5 12 4 4L19 6"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M5 17v3h14v-3"/>',printer:'<path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 15h12v6H6z"/>',arrow:'<path d="M5 12h14m-7-7 7 7-7 7"/>',trash:'<path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6m5 4v7m4-7v7"/>',spark:'<path d="m12 3 1.6 5.4L19 10l-5.4 1.6L12 17l-1.6-5.4L5 10l5.4-1.6L12 3Z"/>',calendar:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>',close:'<path d="M5 5l14 14M19 5 5 19"/>',more:'<path d="M4 7h16M4 12h16M4 17h16"/>',up:'<path d="m6 15 6-6 6 6"/>'};return `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${x[k]||x.spark}</svg>`}
function button(text,act,cls='btn btn-soft',more=''){return `<button class="${cls}" type="button" data-act="${act}" ${more}>${text}</button>`}
function top(){const links=[['today','Today'],['week','Week'],['people','People'],['review','Review'],['rhythms','Rhythms'],['settings','Settings']];const navIcon={today:'today',week:'week',people:'people',review:'review',rhythms:'rhythms',settings:'settings'};return `<aside class="side"><div class="brand"><div class="brand-mark">P³</div><div><div class="brand-name">People, Punchlines<br>&amp; Prayers</div><div class="brand-sub">A personal daybook</div></div></div><div class="side-kicker">Your pages</div><nav class="nav" aria-label="Main navigation">${links.map(([a,b])=>`<button type="button" class="nav-btn ${ui.view===a?'active':''}" data-act="view" data-view="${a}">${icon(navIcon[a])} ${b}</button>`).join('')}</nav><div class="side-bottom"><p>Plan deliberately.<br>Live attentively.<br>Review without judgment.</p><small>Saved privately in this browser.</small></div></aside><main class="main"><div class="mobile-head"><span class="brand-mini"><span class="brand-mark">P³</span> People, Punchlines & Prayers</span><button data-act="view" data-view="settings" class="icon-btn" aria-label="Settings">${icon('settings')}</button></div><div class="topbar"><span class="breadcrumb">Daybook / ${e(ui.view)}</span><span class="top-actions"><span class="save-note"><span class="save-dot"></span> On-device save</span><button data-act="print" class="icon-btn" title="Print the page" aria-label="Print the page">${icon('printer')}</button><button data-act="export" class="icon-btn" title="Back up your data" aria-label="Back up your data">${icon('download')}</button></span></div><div id="page"></div></main><nav class="bottom-nav" aria-label="Mobile navigation">${[['today','Today'],['week','Week'],['people','People'],['review','Review'],['rhythms','More']].map(([a,b])=>`<button class="bottom-item ${ui.view===a||(a==='rhythms'&&ui.view==='settings')?'active':''}" data-act="view" data-view="${a}">${icon(a==='rhythms'?'more':a,19)}<span>${b}</span></button>`).join('')}</nav>`}
function dateNav(){return `<div class="date-switch"><button class="icon-btn" data-act="prev-day" title="Previous day" aria-label="Previous day">${icon('chevleft')}</button><label class="date-pill">${fmt(ui.date,{weekday:'short',month:'short',day:'numeric'})}</label><button class="icon-btn" data-act="next-day" title="Next day" aria-label="Next day">${icon('chevright')}</button><input type="date" id="jump-date" value="${ui.date}" aria-label="Choose date"><button class="date-pill" data-act="go-today">Today</button></div>`}
function priorityPanel(d){return `<section class="panel"><div class="panel-head"><div><h2 class="panel-title">What matters today</h2><p class="panel-sub">Choose the important, not just the urgent.</p></div>${button(icon('plus')+' Add','add-priority','btn btn-soft btn-small')}</div><div class="priority-list">${d.priorities.length?d.priorities.map(p=>`<div class="priority ${p.done?'done':''}"><input type="checkbox" data-act="priority-check" data-id="${p.id}" ${p.done?'checked':''} aria-label="Complete priority"><input type="text" data-bind="priority-text" data-id="${p.id}" value="${e(p.text)}" placeholder="What deserves attention?" aria-label="Priority"><button class="ghost-x" data-act="remove-priority" data-id="${p.id}" title="Remove priority" aria-label="Remove priority">×</button></div>`).join(''):'<div class="empty">Nothing chosen yet. You only need a few true priorities.</div>'}</div></section>`}
function slotCard(x){return `<div class="slot" style="--slot-color:${catColor(x.category)}"><div class="slot-time">${clock(x.start)}<small>${clock(x.end)}</small></div><div class="slot-rail"></div><div class="slot-card ${x.status==='done'?'done':''} ${x.status==='skipped'?'skipped':''}"><div style="min-width:0"><div class="slot-title">${e(x.title)}</div>${x.note?`<div class="slot-note">${e(x.note)}</div>`:''}<div class="slot-type">${e(CATS[x.category]?.[0]||'Other')}</div></div><div class="slot-controls"><select aria-label="Block status" class="slot-status" data-act="block-status" data-id="${x.id}"><option value="planned" ${x.status==='planned'?'selected':''}>Planned</option><option value="done" ${x.status==='done'?'selected':''}>Done</option><option value="moved" ${x.status==='moved'?'selected':''}>Moved</option><option value="skipped" ${x.status==='skipped'?'selected':''}>Let go</option></select><button class="icon-btn" data-act="edit-block" data-id="${x.id}" aria-label="Edit ${e(x.title)}" title="Edit block" style="min-width:29px;height:29px;padding:0">${icon('edit',14)}</button></div></div></div>`}
function clock(s){let [h,m]=(s||'00:00').split(':').map(Number);return `${h%12||12}:${String(m).padStart(2,'0')}${h<12?'a':'p'}`}
function agendaPanel(d){return `<section class="panel"><div class="panel-head"><div><h2 class="panel-title">Time I've claimed</h2><p class="panel-sub">Appointments, commitments, personal time, and margin.</p></div>${button(icon('plus')+' Block','new-block','btn btn-soft btn-small')}</div><div class="timeline">${d.blocks.length?[...d.blocks].sort((a,b)=>a.start.localeCompare(b.start)).map(slotCard).join(''):'<div class="empty"><strong>Your day is open.</strong>Claim the hours you want to direct.</div>'}</div><div class="footer-line"><span class="quiet">Schedules can change. The point is having a say.</span>${button('Plan tomorrow '+icon('arrow',14),'tomorrow','btn btn-outline btn-small')}</div></section>`}
function goalPanel(d){return `<section class="panel"><div class="panel-head"><div><h2 class="panel-title">Goals / actuals</h2><p class="panel-sub">A record, not a report card. Edit the aims daily.</p></div>${button(icon('plus')+' Track','new-goal','btn btn-soft btn-small')}</div><div class="goal-labels"><span>Measure</span><span>Aim</span><span></span><span>Did</span><span></span></div><div class="goal-list">${d.goals.map(g=>`<div class="goal"><div><div class="goal-name">${e(g.label)}</div><span class="goal-unit">${e(g.unit)}</span></div><input type="number" class="goal-input" data-bind="goal-target" data-id="${g.id}" aria-label="Aim for ${e(g.label)}" min="0" value="${Number(g.target)||0}"><span class="goal-divider">/</span><input type="number" class="goal-input" data-bind="goal-actual" data-id="${g.id}" aria-label="Actual ${e(g.label)}" min="0" placeholder="—" value="${g.actual===''?'':Number(g.actual)}"><button class="icon-btn" style="min-width:23px;height:28px;padding:0;border:0;background:transparent" title="Edit ${e(g.label)}" data-act="edit-goal" data-id="${g.id}">${icon('edit',14)}</button></div>`).join('')}</div><p class="helper">You can record zero, exceed the aim, or leave it blank. No streaks or penalties.</p></section>`}
function duePeople(date){return state.people.filter(p=>p.due&&p.due<=date).sort((a,b)=>a.due.localeCompare(b.due))}
function personItem(p,compact=false){let overdue=p.due&&p.due<TODAY(),today=p.due===TODAY();return `<div class="person"><div class="avatar">${e(initials(p.name))}</div><div class="person-body"><div class="person-name">${e(p.name)}</div><div class="person-action">${e(p.next||'No next action set')}</div><div class="person-meta"><span class="tag">${e(p.sphere||'Personal')}</span>${p.due?`<span class="tag ${overdue?'gold':today?'green':''}">${overdue?'Since ':''}${fmt(p.due,{month:'short',day:'numeric'})}</span>`:''}</div><div class="person-actions">${button('Followed up','person-done','btn btn-soft btn-small',`data-id="${p.id}"`)}${button('Edit','edit-person','btn btn-outline btn-small',`data-id="${p.id}"`)}</div></div></div>`}
function peoplePanel(){let ps=duePeople(ui.date);return `<section class="panel"><div class="panel-head"><div><h2 class="panel-title">People to remember</h2><p class="panel-sub">A person shouldn't get lost in a task list.</p></div>${button(icon('plus')+' Person','new-person','btn btn-soft btn-small')}</div><div class="person-list">${ps.length?ps.slice(0,4).map(x=>personItem(x,true)).join(''):'<div class="empty"><strong>No follow-ups due here.</strong>Keep people in view without inventing busywork.</div>'}</div>${ps.length>4?`<div class="footer-line">${button(`See all ${ps.length} people ${icon('arrow',14)}`,'people-view','btn btn-outline btn-small')}</div>`:''}<div class="footer-line">${button('Open people list '+icon('arrow',14),'people-view','btn btn-outline btn-small')}</div></section>`}
function journalPanel(d){return `<section class="panel"><div class="panel-head"><div><h2 class="panel-title">Capture, don't carry</h2><p class="panel-sub">Brief notes to keep your mind free.</p></div></div><div class="subfield"><label for="punchlines">Punchlines · a premise or observation</label><textarea id="punchlines" data-bind="punchlines" placeholder="One concrete detail worth returning to…">${e(d.punchlines)}</textarea></div><div class="subfield"><label for="prayers">Prayers · scripture or personal reflection</label><textarea id="prayers" data-bind="prayers" placeholder="Something I want to remember, study, or pray about…">${e(d.prayers)}</textarea></div><details class="compact-details"><summary>Evening review</summary><div class="subfield"><label for="reflection">What actually mattered today?</label><textarea id="reflection" data-bind="reflection" placeholder="No grade. Just notice what happened.">${e(d.reflection)}</textarea></div></details><p class="helper">Quick capture only. Keep your full comedy drafts in Bits and long-form study in Good Plates.</p></section>`}
function todayView(){const d=ensureDay(ui.date);return `<header><p class="eyebrow">Plan with intention</p><h1 class="page-title">Your day, deliberately.</h1><p class="page-lede">Give time a purpose, including the time that's simply yours.</p></header><div class="date-row"><div class="date-heading"><strong>${fmt(ui.date)}</strong>${ui.date===TODAY()?'<span>· Today</span>':ui.date===plus(TODAY(),1)?'<span>· Tomorrow</span>':''}</div>${dateNav()}</div><div class="intention"><div><p class="eyebrow">The day's intention</p><h3>What kind of day am I choosing?</h3><input type="text" data-bind="intention" value="${e(d.intention)}" placeholder="e.g. Be present, follow through, leave margin" maxlength="220" aria-label="Daily intention"></div><span class="intention-flourish">✳</span></div><div class="day-grid"><div class="stack">${priorityPanel(d)}${agendaPanel(d)}</div><div class="stack">${goalPanel(d)}${peoplePanel()}${journalPanel(d)}</div></div>`}
function weekView(){ui.week=monday(ui.week);let dates=Array.from({length:7},(_,i)=>plus(ui.week,i));let all=dates.map(x=>[x,ensureDay(x)]);const fmtWeek=`${fmt(dates[0],{month:'short',day:'numeric'})} – ${fmt(dates[6],{month:'short',day:'numeric',year:'numeric'})}`;return `<header><p class="eyebrow">Seven days, one direction</p><h1 class="page-title">The week at a glance.</h1><p class="page-lede">See the shape of the week before the week starts making decisions for you.</p></header><div class="week-top"><strong>${fmtWeek}</strong><div class="date-switch"><button class="icon-btn" data-act="prev-week">${icon('chevleft')}</button><button class="date-pill" data-act="this-week">This week</button><button class="icon-btn" data-act="next-week">${icon('chevright')}</button></div></div><div class="week-grid">${all.map(([date,d])=>{let blocks=[...d.blocks].sort((a,b)=>a.start.localeCompare(b.start));return `<button class="week-day ${date===TODAY()?'current':''}" data-act="open-day" data-date="${date}"><div class="week-day-header"><span>${fmt(date,{weekday:'short'})}</span><strong>${parseDate(date).getDate()}</strong></div><div class="week-items">${blocks.slice(0,4).map(b=>`<div class="week-item" style="--c:${catColor(b.category)}">${e(clock(b.start)+' '+b.title)}</div>`).join('')}${blocks.length>4?`<span class="week-more">+${blocks.length-4} more</span>`:''}</div></button>`}).join('')}</div><div class="grid-2" style="margin-top:19px"><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Choose your open time</h2><p class="panel-sub">Wednesday and Friday are opportunities for intentional revenue work.</p></div></div><p class="quiet">Roofing appointments can change the day. Use time blocks as chosen priorities, not inflexible rules. Add personal writing and family time before the week fills itself.</p>${button('Edit recurring rhythms '+icon('arrow',14),'rhythms-view','btn btn-soft')}</section><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Planning from the day before</h2></div></div><p class="quiet">A five-minute decision tonight can keep tomorrow from beginning as a negotiation. Choose priorities and claim one quiet block before you go to bed.</p>${button('Plan tomorrow '+icon('arrow',14),'tomorrow','btn btn-soft')}</section></div>`}
function peopleView(){const upcoming=[...state.people].sort((a,b)=>!a.due?1:!b.due?-1:a.due.localeCompare(b.due));return `<header><p class="eyebrow">Keep your word</p><h1 class="page-title">People, not just tasks.</h1><p class="page-lede">Remember conversations, promises, and the people who need a follow-up.</p></header><div class="page-actions" style="margin:24px 0">${button(icon('plus')+' Add someone','new-person','btn btn-primary')}</div><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Follow-through list</h2><p class="panel-sub">People remain here until you finish or update the next action.</p></div><span class="tag green">${state.people.length} tracked</span></div><div class="person-list">${upcoming.length?upcoming.map(x=>personItem(x)).join(''):'<div class="empty"><strong>No one on the list yet.</strong>Add a person, what you promised, and when you want to follow up.</div>'}</div></section><p class="quiet" style="margin:16px 2px">Privacy note: this app stores information on this device. Avoid writing confidential counseling, welfare, or membership details in these notes.</p>`}
function reviewView(){const start=monday(ui.week);let dates=Array.from({length:7},(_,i)=>plus(start,i)),ds=dates.map(s=>ensureDay(s)),completed=ds.reduce((s,d)=>s+d.priorities.filter(p=>p.done).length,0),planned=ds.reduce((s,d)=>s+d.priorities.length,0),actualRows={};let noted=0,followups=0;ds.forEach(d=>{for(let g of d.goals){let key=g.label+'|'+g.unit;if(!actualRows[key])actualRows[key]={label:g.label,unit:g.unit,target:0,actual:0,logged:0};actualRows[key].target+=Number(g.target)||0;if(g.actual!==''){actualRows[key].actual+=Number(g.actual)||0;actualRows[key].logged++}}if(d.reflection.trim())noted++;followups+=d.blocks.filter(b=>b.status==='done').length});const metrics=Object.values(actualRows);return `<header><p class="eyebrow">Look back, learn forward</p><h1 class="page-title">A week in actuals.</h1><p class="page-lede">What happened matters more than whether the day went according to plan.</p></header><div class="week-top"><strong>${fmt(start,{month:'short',day:'numeric'})} – ${fmt(plus(start,6),{month:'short',day:'numeric',year:'numeric'})}</strong><div class="date-switch"><button class="icon-btn" data-act="prev-week">${icon('chevleft')}</button><button class="date-pill" data-act="this-week">This week</button><button class="icon-btn" data-act="next-week">${icon('chevright')}</button></div></div><div class="stats"><div class="stat"><div class="stat-number">${completed}</div><div class="stat-label">Priorities completed <span class="muted">/ ${planned} chosen</span></div></div><div class="stat"><div class="stat-number">${followups}</div><div class="stat-label">Time blocks marked done</div></div><div class="stat"><div class="stat-number">${noted}</div><div class="stat-label">Days with a reflection</div></div><div class="stat"><div class="stat-number">${duePeople(plus(start,6)).length}</div><div class="stat-label">Follow-ups due by week's end</div></div></div><div class="grid-2"><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Goals / actuals</h2><p class="panel-sub">Only recorded actuals are counted. Blank is unknown, not zero.</p></div></div><table class="review-table"><thead><tr><th>Measure</th><th>Aim</th><th>Recorded</th></tr></thead><tbody>${metrics.map(g=>`<tr><td><strong>${e(g.label)}</strong><div class="muted" style="font-size:10px">${e(g.unit)} · ${g.logged} day${g.logged!==1?'s':''} logged</div></td><td>${g.target}</td><td>${g.logged?g.actual:'—'}</td></tr>`).join('')}</tbody></table></section><section class="panel"><div class="panel-head"><div><h2 class="panel-title">What the days said</h2><p class="panel-sub">Reflections, not grades.</p></div></div>${dates.map((date,i)=>ds[i].reflection.trim()?`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><span class="tag">${fmt(date,{weekday:'short',month:'short',day:'numeric'})}</span><p style="margin:6px 0 0;font-size:12px;white-space:pre-wrap">${e(ds[i].reflection)}</p></div>`:'').join('')||'<div class="empty">Nothing written yet. A single sentence is enough.</div>'}</section></div><p class="quiet" style="margin:17px 0">A lower actual than aim may mean plans changed, family needed you, or the goal was unrealistic. It is information, not a verdict.</p>`}
function rhythmView(){let rules=state.rhythms;return `<header><p class="eyebrow">Decide once, use often</p><h1 class="page-title">Your recurring rhythms.</h1><p class="page-lede">The non-negotiables and chosen anchors that give your week a shape.</p></header><div class="page-actions" style="margin:24px 0">${button(icon('plus')+' New recurring block','new-rhythm','btn btn-primary')}</div><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Weekly commitments</h2><p class="panel-sub">Changes affect newly opened dates; already planned days keep their edits.</p></div></div>${rules.length?rules.map(r=>`<div class="rhythm-row"><div><strong>${e(r.title)}</strong><div class="rhythm-days">${r.days.slice().sort((a,b)=>(a+6)%7-(b+6)%7).map(x=>DAY_NAMES[x]).join(' · ')} · ${clock(r.start)}–${clock(r.end)} · ${e(CATS[r.category]?.[0]||'Other')}</div>${r.note?`<div class="quiet" style="margin-top:5px">${e(r.note)}</div>`:''}</div><button data-act="edit-rhythm" data-id="${r.id}" class="icon-btn" aria-label="Edit ${e(r.title)}">${icon('edit')}</button></div>`).join(''):'<div class="empty">No recurring blocks yet.</div>'}</section><div class="tip" style="margin-top:16px">Morning gym, work shifts, Wednesday youth, and Sunday meetings have been entered as a starting template from your schedule. Some Sunday end times are estimates: adjust them here. Your every-other-Sunday missionary dessert isn't scheduled yet because the starting Sunday isn't set.</div>`}
function settingsView(){return `<header><p class="eyebrow">Own your information</p><h1 class="page-title">Settings & backups.</h1><p class="page-lede">A private, lightweight daybook. No login, account, or cloud sync.</p></header><div class="grid-2" style="margin-top:23px"><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Back up your daybook</h2><p class="panel-sub">Your notes are saved in this browser only.</p></div></div><p class="quiet">Export regularly if you use this every day. Import restores an exported copy and replaces the current data on this device.</p><div class="settings-actions">${button(icon('download')+' Export JSON','export','btn btn-primary')}${button('Import backup','import','btn btn-outline')}</div></section><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Keep it your own</h2></div></div><p class="quiet">This app has no access to Google Calendar, church systems, Bits, or Good Plates. It works as a standalone daybook and does not send notes anywhere.</p><p class="quiet">For now, do not enter private membership interviews or sensitive personal counseling information.</p><div class="settings-actions">${button('Edit recurring schedule','rhythms-view','btn btn-outline')}${button('Erase local data','reset','btn btn-danger')}</div></section></div><section class="panel" style="margin-top:19px"><div class="panel-head"><div><h2 class="panel-title">The daily practice</h2></div></div><p class="quiet">Plan tomorrow in five minutes. Choose a few priorities, mark the hours you've claimed, and identify one person you don't want to forget. During the day, record what actually happened. At night, notice what mattered. Pleasure, margin, family, study, and quiet all count as legitimate uses of time even when they produce no measurable output.</p></section>`}
function render(){document.getElementById('app').innerHTML=top();let views={today:todayView,week:weekView,people:peopleView,review:reviewView,rhythms:rhythmView,settings:settingsView};document.getElementById('page').innerHTML=(views[ui.view]||todayView)();document.title=`${ui.view==='today'?fmt(ui.date,{month:'short',day:'numeric'})+' · ':''}People, Punchlines & Prayers`;}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.tm);toast.tm=setTimeout(()=>t.classList.remove('show'),2700)}
function modal(title,fields,onSubmit,remove){const d=document.getElementById('editor');d.innerHTML=`<form id="edit-form"><div class="modal-header"><h2>${e(title)}</h2><button type="button" class="icon-btn" data-act="close-modal" aria-label="Close">${icon('close')}</button></div><div class="modal-content">${fields}</div><div class="modal-footer">${remove?`<button type="button" class="btn btn-danger" id="delete-item">Delete</button>`:'<span></span>'}<button class="btn btn-primary" type="submit">Save changes ${icon('check',15)}</button></div></form>`;d.showModal();d.querySelector('form').addEventListener('submit',ev=>{ev.preventDefault();const f=new FormData(ev.currentTarget);if(onSubmit(f)!==false){d.close();render();persist()}});if(remove)d.querySelector('#delete-item').addEventListener('click',()=>{if(confirm('Delete this entry?')){remove();d.close();persist();render()}})}
function catSelect(value){return `<select name="category">${Object.entries(CATS).map(([k,[v]])=>`<option value="${k}" ${value===k?'selected':''}>${e(v)}</option>`).join('')}</select>`}
function field(name,label,val='',type='text',attrs=''){return `<label class="field"><span>${e(label)}</span><input name="${name}" type="${type}" value="${e(val)}" ${attrs}></label>`}
function blockModal(item){const d=ensureDay(ui.date);const old=item||{title:'',category:'rest',start:'',end:'',note:'',status:'planned'};modal(item?'Edit time block':'Claim some time',`${field('title','What is this time for?',old.title,'text','required maxlength="120" placeholder="e.g. Quiet writing at the church office"')}<div class="form-row">${field('start','From',old.start,'time','required')}${field('end','Until',old.end,'time','required')}</div><label class="field"><span>Type of time</span>${catSelect(old.category)}</label><label class="field"><span>Note (optional)</span><textarea name="note" placeholder="What will make this time meaningful?">${e(old.note||'')}</textarea></label><div class="tip">You can claim free time, too. Nothing needs to be earned before you take it.</div>`,f=>{if(f.get('end')<=f.get('start')){toast('End time must be after start time.');return false}const obj={title:String(f.get('title')).trim(),start:String(f.get('start')),end:String(f.get('end')),category:String(f.get('category')),note:String(f.get('note')).trim()};if(item)Object.assign(item,obj);else d.blocks.push({...obj,id:id(),status:'planned',actual:''});},item?()=>{d.blocks=d.blocks.filter(x=>x.id!==item.id)}:null)}
function goalModal(g){const d=ensureDay(ui.date);modal(g?'Edit a measure':'Track something that matters',`${field('label','What are you measuring?',g?.label||'','text','required maxlength="55" placeholder="e.g. Reading"')}${field('unit','Unit',g?.unit||'minutes','text','required maxlength="24" placeholder="minutes, words, calls…"')}${field('target','Today’s aim',g?.target??0,'number','min="0" step="1" required')}<div class="tip">Choose a measure because it helps you notice your life, not because everything needs measuring.</div>`,f=>{let x={label:String(f.get('label')).trim(),unit:String(f.get('unit')).trim(),target:Math.max(0,Number(f.get('target'))||0)};if(g)Object.assign(g,x);else d.goals.push({...x,id:id(),actual:''})},g?()=>{d.goals=d.goals.filter(x=>x.id!==g.id)}:null)}
function personModal(p){const old=p||{name:'',sphere:'Personal',next:'',due:'',notes:''};modal(p?'Edit follow-up':'Remember someone',`${field('name','Person',old.name,'text','required maxlength="90" placeholder="Name"')}<label class="field"><span>Relationship / area</span><select name="sphere">${['Family','Ward','Work','Friends','Personal','Other'].map(x=>`<option ${old.sphere===x?'selected':''}>${x}</option>`).join('')}</select></label>${field('next','Next action',old.next,'text','maxlength="180" placeholder="What do I owe them?"')}${field('due','Follow up by (optional)',old.due,'date')}<label class="field"><span>Brief note (optional)</span><textarea name="notes" placeholder="Not confidential details. Just a reminder.">${e(old.notes||'')}</textarea></label><div class="tip">Track what you need to do next, not sensitive details about the person.</div>`,f=>{const x={name:String(f.get('name')).trim(),sphere:String(f.get('sphere')),next:String(f.get('next')).trim(),due:String(f.get('due')),notes:String(f.get('notes')).trim()};if(p)Object.assign(p,x);else state.people.push({...x,id:id()})},p?()=>{state.people=state.people.filter(x=>x.id!==p.id)}:null)}
function rhythmModal(r){const old=r||{title:'',category:'other',start:'09:00',end:'10:00',days:[],note:''};modal(r?'Edit recurring block':'New recurring block',`${field('title','Commitment',old.title,'text','required maxlength="120"') }<div class="form-row">${field('start','From',old.start,'time','required')}${field('end','Until',old.end,'time','required')}</div><label class="field"><span>Category</span>${catSelect(old.category)}</label><div class="field"><span class="field-label">Repeat on</span><div class="days-checkboxes">${[1,2,3,4,5,6,0].map(x=>`<label><input type="checkbox" name="days" value="${x}" ${old.days.includes(x)?'checked':''}><span>${DAY_NAMES[x]}</span></label>`).join('')}</div></div><label class="field"><span>Note (optional)</span><textarea name="note">${e(old.note||'')}</textarea></label>`,f=>{const days=f.getAll('days').map(Number);if(!days.length){toast('Choose at least one day.');return false}if(f.get('end')<=f.get('start')){toast('End time must be after start.');return false}const x={title:String(f.get('title')).trim(),category:String(f.get('category')),start:String(f.get('start')),end:String(f.get('end')),note:String(f.get('note')).trim(),days};if(r)Object.assign(r,x);else state.rhythms.push({...x,id:id()})},r?()=>{state.rhythms=state.rhythms.filter(x=>x.id!==r.id)}:null)}
function exportJSON(){let blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});let a=document.createElement('a');let url=URL.createObjectURL(blob);a.href=url;a.download='people-punchlines-prayers-backup-'+TODAY()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exported.')}
function action(act,node){const d=ensureDay(ui.date);const item=id=>d.blocks.find(x=>x.id===id);let p,g,r;switch(act){case'view':ui.view=node.dataset.view;render();window.scrollTo(0,0);break;case'people-view':ui.view='people';render();window.scrollTo(0,0);break;case'rhythms-view':ui.view='rhythms';render();window.scrollTo(0,0);break;case'prev-day':ui.date=plus(ui.date,-1);render();break;case'next-day':ui.date=plus(ui.date,1);render();break;case'go-today':ui.date=TODAY();render();break;case'tomorrow':ui.date=plus(TODAY(),1);ui.view='today';render();window.scrollTo(0,0);break;case'open-day':ui.date=node.dataset.date;ui.view='today';render();window.scrollTo(0,0);break;case'prev-week':ui.week=plus(ui.week,-7);render();break;case'next-week':ui.week=plus(ui.week,7);render();break;case'this-week':ui.week=monday(TODAY());render();break;case'add-priority':d.priorities.push({id:id(),text:'',done:false});persist();render();{let nodes=[...document.querySelectorAll('[data-bind="priority-text"]')];nodes[nodes.length-1]?.focus()}break;case'priority-check':p=d.priorities.find(x=>x.id===node.dataset.id);if(p){p.done=node.checked;persist();node.closest('.priority')?.classList.toggle('done',p.done)}break;case'remove-priority':d.priorities=d.priorities.filter(x=>x.id!==node.dataset.id);persist();render();break;case'new-block':blockModal();break;case'edit-block':blockModal(item(node.dataset.id));break;case'new-goal':goalModal();break;case'edit-goal':goalModal(d.goals.find(x=>x.id===node.dataset.id));break;case'block-status':p=item(node.dataset.id);if(p){p.status=node.value;persist();render()}break;case'new-person':personModal();break;case'edit-person':personModal(state.people.find(x=>x.id===node.dataset.id));break;case'person-done':p=state.people.find(x=>x.id===node.dataset.id);if(p){p.due='';p.next='';p.lastContact=TODAY();persist();render();toast('Follow-up recorded. Add a new next action whenever needed.')}break;case'new-rhythm':rhythmModal();break;case'edit-rhythm':rhythmModal(state.rhythms.find(x=>x.id===node.dataset.id));break;case'export':exportJSON();break;case'import':document.getElementById('import-file').click();break;case'print':window.print();break;case'close-modal':document.getElementById('editor').close();break;case'reset':if(confirm('Permanently erase every day, person, and recurring block saved in this browser? Please export a backup first.')){state=defaults();ui.date=TODAY();ui.week=monday(TODAY());persist();render();toast('Local daybook reset.')}break}}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el||el.matches('input, select'))return;action(el.dataset.act,el)});
document.addEventListener('change',ev=>{const el=ev.target;if(el.id==='jump-date'&&el.value){ui.date=el.value;render();return}if(el.matches('[data-act="priority-check"],[data-act="block-status"]')){action(el.dataset.act,el);return}if(el.dataset.bind==='goal-target'||el.dataset.bind==='goal-actual'){const d=ensureDay(ui.date);const g=d.goals.find(x=>x.id===el.dataset.id);if(g){g[el.dataset.bind==='goal-target'?'target':'actual']=el.value===''?(el.dataset.bind==='goal-target'?0:''):Math.max(0,Number(el.value)||0);persist()}}});
document.addEventListener('input',ev=>{let el=ev.target,bind=el.dataset.bind;if(!bind)return;let d=ensureDay(ui.date);if(bind==='priority-text'){let p=d.priorities.find(x=>x.id===el.dataset.id);if(p)p.text=el.value}else if(['intention','punchlines','prayers','reflection'].includes(bind))d[bind]=el.value;else return;persist()});
document.getElementById('import-file').addEventListener('change',async ev=>{let file=ev.target.files?.[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!data||typeof data!=='object'||!Array.isArray(data.rhythms)||!Array.isArray(data.people)||!data.days||typeof data.days!=='object')throw Error('Not a valid daybook file');if(confirm('Replace current local planner data with this backup?')){state={version:1,settings:data.settings||{},rhythms:data.rhythms,people:data.people,days:data.days};persist();render();toast('Backup restored.')}}catch(error){toast('Could not import: invalid backup file.')}ev.target.value=''});
render();
})();
</script>
</body>
</html>
